# Front proxy for docker-compose.poc.yml. It plays the part the ALB plays on AWS:
# /api/* goes to the Express backend, everything else to the Next.js server, so the
# browser sees one origin and the SPA keeps calling relative /api/... URLs.
# Docker's DNS is re-queried every 10 s, so restarting a container does not leave
# nginx holding a stale IP.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;

    location /api/ {
        set $backend http://backend:4000;
        proxy_pass $backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        set $frontend http://frontend:3000;
        proxy_pass $frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
